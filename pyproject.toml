[project]
name = "dailyexchangerate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "openpyxl>=3.1.5",
    "oracledb>=3.4.2",
    "pandas>=3.0.0",
    "playwright>=1.58.0",
    "mssql-python>=1.3.0",
    "pyodbc>=5.3.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "selenium>=4.40.0",
    "sqlalchemy>=2.0.46",
    "webdriver-manager>=4.0.2",
    "pillow>=12.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]
